# Lint and unit tests on every push to dev and every pull request (no database, no API key).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check --diff
      - run: uv run pytest -q -m "not integration"
