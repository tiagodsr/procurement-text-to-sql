[project]
name = "procurement-text-to-sql"
version = "0.1.0"
description = "Natural-language questions over synthetic procurement data, answered with safe read-only SQL."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1,<3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "assistant"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the compose database (docker compose -f docker-compose.yml -f compose.dev.yml up -d db)",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# The generator is mostly data tables with very long lines. Reformatting it would rewrite
# most of the file for no benefit, so its layout is left alone.
exclude = ["scripts/build_db.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The generator's draw logic is frozen: any change risks changing the seeded data.
"scripts/build_db.py" = ["E501", "RUF046"]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
