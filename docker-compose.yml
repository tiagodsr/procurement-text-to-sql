name: procurement-text-to-sql

services:
  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: postgres
      # Local admin password, used only by the init scripts. Override it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
    volumes:
      # First start only: 01_dump.sql.gz (data), then 02_roles.sql (app_ro).
      - ./data/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, so it only passes once the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U postgres -d procurement"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Loopback only, for `uv run ask` and the integration tests on this machine. The application
    # connects as the read-only role app_ro.
    ports:
      - "127.0.0.1:55432:5432"
    restart: unless-stopped

  api:
    build: .
    image: procurement-text-to-sql:local
    environment:
      # Inside compose the database is `db:5432`. The key and the models come from .env (or the
      # shell); an empty value means the default, and without a key the page shows a warning.
      DATABASE_URL: postgresql://app_ro:app_ro_local@db:5432/procurement
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Loopback only: the API spends the key's money and has no login.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    image: procurement-text-to-sql:local
    command: ["streamlit", "run", "src/assistant/ui.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  db-data:
